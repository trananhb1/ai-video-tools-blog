<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AI Video Picks">
  <!--
    AI Video Picks brand mark.
    Play triangle (video) with a checkmark knocked out (curated pick).
    Single path, nonzero fill-rule: the outer triangle is wound clockwise and
    the check counter-clockwise, so the check reads as a true hole on any
    background. The check is clipped to sit fully inside the triangle with
    ~0.9 units of clearance — otherwise the overhang renders as a stray blob.
    Geometry and #4fc3f7 carried over from the original assets/logo.png.
  -->
